<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="external.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <title>Picasso's Pain</title>
  </head>
  <body>
    <!-- bootstrap-sourced form -->
    <form>
      <div class="form-group">
        <label for="exampleInputEmail1">Email address</label>
        <input
          type="email"
          class="form-control"
          id="exampleInputEmail1"
          aria-describedby="emailHelp"
          placeholder="Enter email"
        />
        <small id="emailHelp" class="form-text text-muted"
          >We will sell your email</small
        >
      </div>
      <div class="form-group">
        <label for="exampleInputPassword1">Password</label>
        <input
          type="password"
          class="form-control"
          id="exampleInputPassword1"
          placeholder="Password"
        />
      </div>
      <div class="form-check"></div>
      <button
        type="button"
        class="btn btn-primary"
        onclick="url('./formsubmitted.html')"
      >
        Submit
      </button>
    </form>

    <div>
      <img
        class="sun"
        src="https://c.tadst.com/gfx/600x337/istock-936863548.jpg?1"
      />
      <img
        class="moon"
        src="https://www.nhm.ac.uk/content/dam/nhm-www/discover/space-pictures/super-full-moon-full-width.jpg.thumb.1160.1160.png"
      />
    </div>
  </body>
</html>
